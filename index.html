<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>神戸 TOTTEI ABCクリスマスマーケット2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f5ef;
      color: #222;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 26px;
      line-height: 1.45;
      text-align: center;
    }

    .description {
      margin-bottom: 28px;
      line-height: 1.8;
      font-size: 14px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
    }

    .required {
      color: #d33;
      font-size: 12px;
      margin-left: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .date-loading {
      padding: 18px;
      text-align: center;
      border-radius: 10px;
      background: #f3f3f3;
      color: #666;
    }

    .date-error {
      padding: 16px;
      border-radius: 10px;
      background: #fff0f0;
      color: #c00;
      line-height: 1.7;
    }

    .date-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .date-item {
      position: relative;
    }

    .date-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .date-item label {
      margin: 0;
      padding: 13px 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      background: #fff;
      font-weight: 500;
      transition: 0.15s;
    }

    .date-item input:checked + label {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .date-item.full label {
      background: #eee;
      color: #aaa;
      border-color: #ddd;
      cursor: not-allowed;
    }

    .date-note {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .privacy {
      margin-top: 25px;
      padding: 16px;
      background: #f7f7f7;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.8;
    }

    .privacy-check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 14px;
    }

    .privacy-check input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .submit-button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      display: none;
      line-height: 1.7;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #c00;
    }

    .message.success {
      display: block;
      background: #eef9ef;
      color: #176b27;
    }

    .line-link {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 10px;
      background: #06c755;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        padding: 14px 10px 40px;
      }

      .card {
        padding: 22px 16px;
      }

      h1 {
        font-size: 22px;
      }

      .date-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>
      神戸 TOTTEI ABC<br>
      クリスマスマーケット2026
    </h1>

    <div class="description">
      クリスマスマーケットの運営スタッフ応募フォームです。<br>
      必要事項をご入力のうえ、お申し込みください。
    </div>


    <!-- =========================
         応募フォーム
    ========================== -->

    <form
      id="applicationForm"
      method="POST"
      target="submitFrame"
      action="https://script.google.com/macros/s/AKfycbyGAKlINKbinXF4dDU58Vux93WOtUsQUQ-_8AMPsw27_u83f4HMrpKrbZY7MgGKo4wgiw/exec"
    >

      <!-- 名前 -->
      <div class="field">

        <label>
          名前（カタカナ表記）
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          name="name"
          required
          placeholder="ヤマダ タロウ"
        >

      </div>


      <!-- 学年 -->
      <div class="field">

        <label>
          学年
          <span class="required">必須</span>
        </label>

        <select
          name="grade"
          required
        >

          <option value="">
            選択してください
          </option>

          <option>高校1年</option>
          <option>高校2年</option>
          <option>高校3年</option>

          <option>大学1年</option>
          <option>大学2年</option>
          <option>大学3年</option>
          <option>大学4年</option>

          <option>大学院1年</option>
          <option>大学院2年</option>
          <option>大学院3年</option>

          <option>専門学校1年</option>
          <option>専門学校2年</option>
          <option>専門学校3年</option>
          <option>専門学校4年</option>

          <option>その他</option>

        </select>

      </div>


      <!-- 学校名 -->
      <div class="field">

        <label>
          学校名
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          name="school"
          required
          placeholder="〇〇大学"
        >

      </div>


      <!-- 生年月日 -->
      <div class="field">

        <label>
          生年月日
          <span class="required">必須</span>
        </label>

        <input
          type="date"
          name="birthDate"
          required
        >

      </div>


      <!-- メール -->
      <div class="field">

        <label>
          メールアドレス
          <span class="required">必須</span>
        </label>

        <input
          type="email"
          name="email"
          required
          placeholder="example@example.com"
        >

      </div>


      <!-- 緊急連絡先 -->
      <div class="field">

        <label>
          緊急連絡先
          <span class="required">必須</span>
        </label>

        <input
          type="tel"
          name="emergency"
          required
          placeholder="090-1234-5678"
        >

      </div>


      <!-- =========================
           希望日程
      ========================== -->

      <div class="field">

        <label>
          希望日程
          <span class="required">必須</span>
        </label>

        <div
          id="dateLoading"
          class="date-loading"
        >
          日程を読み込んでいます…
        </div>

        <div
          id="dateError"
          class="date-error hidden"
        ></div>

        <div
          id="dateList"
          class="date-list hidden"
        ></div>

        <div class="date-note">
          ※ 定員に達した日程は表示されません。<br>
          ※ 先着順での受付となります。
        </div>

      </div>


      <!-- 備考 -->
      <div class="field">

        <label>
          備考
        </label>

        <textarea
          name="note"
          placeholder="質問や連絡事項があればご記入ください。"
        ></textarea>

      </div>


      <!-- 個人情報 -->
      <div class="privacy">

        <strong>
          個人情報の取り扱いについて
        </strong>

        <p>
          収集した個人情報は、法令に基づく場合を除き、
          あらかじめご本人の同意を得ることなく、
          個人データを第三者に提供しません。
        </p>

        <p>
          ご入力いただいた情報は、
          イベント受付、各種連絡、緊急時の連絡、
          その他イベント運営に必要な範囲で使用します。
        </p>

        <label class="privacy-check">

          <input
            type="checkbox"
            name="privacy"
            value="agree"
            required
          >

          <span>
            個人情報の取り扱いについて同意します。
          </span>

        </label>

      </div>


      <button
        id="submitButton"
        class="submit-button"
        type="submit"
      >
        応募する
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

  </div>

</div>


<!-- =========================
     hidden iframe
========================== -->

<iframe
  name="submitFrame"
  id="submitFrame"
  style="display:none;"
></iframe>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyGAKlINKbinXF4dDU58Vux93WOtUsQUQ-_8AMPsw27_u83f4HMrpKrbZY7MgGKo4wgiw/exec';

const LINE_URL =
  'https://lin.ee/84dtwFC';

const DEADLINE =
  new Date(
    '2026-11-24T00:00:00+09:00'
  );


/* =========================
 * 日付表示
 * ========================= */

function formatDateLabel(dateString) {

  const date =
    new Date(
      dateString + 'T00:00:00+09:00'
    );

  const month =
    date.getMonth() + 1;

  const day =
    date.getDate();

  const weekdays = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  const weekday =
    weekdays[
      date.getDay()
    ];

  return (
    month +
    '月' +
    day +
    '日（' +
    weekday +
    '）'
  );
}


/* =========================
 * JSONP
 *
 * fetchではなくJSONPを使用
 * ========================= */

function loadDates() {

  const callbackName =
    'xmasDatesCallback_' +
    Date.now();

  const script =
    document.createElement(
      'script'
    );

  const timeout =
    setTimeout(
      function() {

        cleanup();

        showDateError(
          '日程を読み込めませんでした。ページを再読み込みしてください。'
        );

      },
      15000
    );


  function cleanup() {

    clearTimeout(
      timeout
    );

    if (script.parentNode) {
      script.parentNode.removeChild(
        script
      );
    }

    try {
      delete window[
        callbackName
      ];
    } catch (e) {
      window[
        callbackName
      ] = undefined;
    }
  }


  window[
    callbackName
  ] = function(result) {

    cleanup();

    console.log(
      '日程API response:',
      result
    );

    if (
      !result ||
      !Array.isArray(
        result.dates
      )
    ) {

      showDateError(
        '日程データを取得できませんでした。'
      );

      return;
    }


    if (
      result.closed === true
    ) {

      showDateError(
        '応募受付は終了しました。'
      );

      return;
    }


    renderDates(
      result.dates
    );
  };


  script.src =
    API_URL +
    '?action=dates' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&t=' +
    Date.now();

  script.onerror =
    function() {

      cleanup();

      showDateError(
        '日程情報の取得に失敗しました。'
      );
    };

  document.body.appendChild(
    script
  );
}


/* =========================
 * 日程表示
 * ========================= */

function renderDates(
  dates
) {

  const loading =
    document.getElementById(
      'dateLoading'
    );

  const list =
    document.getElementById(
      'dateList'
    );

  const error =
    document.getElementById(
      'dateError'
    );


  loading.classList.add(
    'hidden'
  );

  error.classList.add(
    'hidden'
  );

  list.innerHTML = '';


  /*
   * 満員の日程は非表示
   */
  const availableDates =
    dates.filter(
      item =>
        Number(
          item.remaining
        ) > 0
    );


  if (
    availableDates.length === 0
  ) {

    showDateError(
      '現在、選択できる日程がありません。'
    );

    return;
  }


  availableDates.forEach(
    function(item, index) {

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'date-item';


      const input =
        document.createElement(
          'input'
        );

      input.type =
        'checkbox';

      input.name =
        'dates';

      input.value =
        item.date;

      input.id =
        'date_' + index;


      const label =
        document.createElement(
          'label'
        );

      label.htmlFor =
        input.id;

      label.textContent =
        formatDateLabel(
          item.date
        );


      wrapper.appendChild(
        input
      );

      wrapper.appendChild(
        label
      );

      list.appendChild(
        wrapper
      );

    }
  );


  list.classList.remove(
    'hidden'
  );
}


/* =========================
 * 日程エラー
 * ========================= */

function showDateError(
  message
) {

  const loading =
    document.getElementById(
      'dateLoading'
    );

  const list =
    document.getElementById(
      'dateList'
    );

  const error =
    document.getElementById(
      'dateError'
    );


  loading.classList.add(
    'hidden'
  );

  list.classList.add(
    'hidden'
  );

  error.textContent =
    message;

  error.classList.remove(
    'hidden'
  );
}


/* =========================
 * 応募送信
 * ========================= */

const form =
  document.getElementById(
    'applicationForm'
  );

const submitButton =
  document.getElementById(
    'submitButton'
  );

const message =
  document.getElementById(
    'message'
  );


form.addEventListener(
  'submit',
  function(event) {

    event.preventDefault();


    /*
     * 日程チェック
     */
    const selectedDates =
      Array.from(
        document.querySelectorAll(
          'input[name="dates"]:checked'
        )
      );


    if (
      selectedDates.length === 0
    ) {

      showMessage(
        '希望日程を1つ以上選択してください。',
        false
      );

      return;
    }


    /*
     * 送信用のhidden inputを作る
     *
     * 同じname=datesを
     * カンマ区切りでGASへ渡す
     */
    const existing =
      form.querySelector(
        'input[data-date-submit="true"]'
      );

    if (existing) {
      existing.remove();
    }


    const hidden =
      document.createElement(
        'input'
      );

    hidden.type =
      'hidden';

    hidden.name =
      'dates';

    hidden.value =
      selectedDates
        .map(
          input => input.value
        )
        .join(',');

    hidden.dataset.dateSubmit =
      'true';

    form.appendChild(
      hidden
    );


    submitButton.disabled =
      true;

    submitButton.textContent =
      '送信中…';


    message.className =
      'message';

    message.style.display =
      'none';


    /*
     * iframe送信
     */
    form.submit();


    /*
     * 結果待ち
     */
    window.xmasSubmitTimeout =
      setTimeout(
        function() {

          submitButton.disabled =
            false;

          submitButton.textContent =
            '応募する';

          showMessage(
            '受付結果を確認できませんでした。二重応募を防ぐため、再送信する前に応募者一覧への登録を確認してください。',
            false
          );

        },
        30000
      );

  }
);


/* =========================
 * GASからの回答
 * ========================= */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data;


    if (
      !data ||
      data.source !==
      'xmas-market-form'
    ) {
      return;
    }


    if (
      window.xmasSubmitTimeout
    ) {

      clearTimeout(
        window.xmasSubmitTimeout
      );

      window.xmasSubmitTimeout =
        null;
    }


    if (
      data.success === true
    ) {

      showSuccess();

    } else {

      submitButton.disabled =
        false;

      submitButton.textContent =
        '応募する';

      showMessage(
        data.message ||
        '応募処理に失敗しました。',
        false
      );
    }

  }
);


/* =========================
 * 成功表示
 * ========================= */

function showSuccess() {

  form.innerHTML = '';

  const success =
    document.createElement(
      'div'
    );

  success.className =
    'message success';

  success.style.display =
    'block';

  success.innerHTML =
    '<strong>応募を受け付けました。</strong><br>' +
    'ご応募ありがとうございます。' +
    '<br><br>' +
    '今後の連絡は公式LINEをご確認ください。' +
    '<br>' +
    '<a class="line-link" href="' +
    LINE_URL +
    '" target="_blank" rel="noopener">' +
    '公式LINEを追加する' +
    '</a>';

  form.appendChild(
    success
  );
}


/* =========================
 * メッセージ
 * ========================= */

function showMessage(
  text,
  success
) {

  message.textContent =
    text;

  message.className =
    success
      ? 'message success'
      : 'message error';

  message.style.display =
    'block';
}


/* =========================
 * 初期処理
 * ========================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    loadDates();

  }
);

</script>

</body>
</html>
