<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>神戸 TOTTEI ABCクリスマスマーケット2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7f5ef;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      line-height: 1.7;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 26px;
      line-height: 1.45;
      letter-spacing: 0.02em;
    }

    .description {
      margin-bottom: 30px;
      font-size: 14px;
      line-height: 1.9;
      color: #444;
    }

    .field {
      margin-bottom: 23px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .required {
      margin-left: 5px;
      color: #d33;
      font-size: 12px;
      font-weight: 700;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      color: #222;
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* =========================
       日程
    ========================= */

    .date-loading {
      padding: 18px;
      border-radius: 10px;
      background: #f3f3f3;
      color: #666;
      text-align: center;
      font-size: 14px;
    }

    .date-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .date-item {
      position: relative;
    }

    .date-item input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .date-item label {
      display: block;
      margin: 0;
      padding: 13px 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.15s,
        color 0.15s,
        border-color 0.15s;
    }

    .date-item input:checked + label {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .date-note {
      margin-top: 10px;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }

    .date-error {
      padding: 15px;
      border-radius: 10px;
      background: #fff0f0;
      color: #c00;
      font-size: 14px;
      line-height: 1.7;
    }

    /* =========================
       個人情報
    ========================= */

    .privacy {
      margin-top: 28px;
      padding: 17px;
      border-radius: 10px;
      background: #f6f6f6;
      font-size: 13px;
      line-height: 1.8;
    }

    .privacy-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .privacy p {
      margin: 8px 0;
    }

    .privacy-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 15px;
      cursor: pointer;
    }

    .privacy-check input {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin: 2px 0 0;
    }

    .privacy-check span {
      flex: 1;
    }

    /* =========================
       ボタン
    ========================= */

    .submit-button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:hover {
      opacity: 0.9;
    }

    .submit-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       メッセージ
    ========================= */

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b00000;
    }

    .message.success {
      display: block;
      background: #eef9ef;
      color: #176b27;
    }

    .line-link {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #06c755;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {

      .container {
        padding: 12px 10px 40px;
      }

      .card {
        padding: 23px 16px;
        border-radius: 16px;
      }

      h1 {
        font-size: 22px;
      }

      .date-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      神戸 TOTTEI ABC<br>
      クリスマスマーケット2026
    </h1>


    <div class="description">
      クリスマスマーケットの運営スタッフ応募フォームです。<br>
      必要事項をご入力のうえ、お申し込みください。
    </div>


    <!-- =====================================
         応募フォーム
    ====================================== -->

    <form
      id="applicationForm"
      method="POST"
      target="submitFrame"
      action="https://script.google.com/macros/s/AKfycbyGAKlINKbinXF4dDU58Vux93WOtUsQUQ-_8AMPsw27_u83f4HMrpKrbZY7MgGKo4wgiw/exec"
    >


      <!-- 名前 -->

      <div class="field">

        <label class="field-label">
          名前（カタカナ表記）
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          name="name"
          placeholder="ヤマダ タロウ"
          required
        >

      </div>


      <!-- 学年 -->

      <div class="field">

        <label class="field-label">
          学年
          <span class="required">必須</span>
        </label>

        <select
          name="grade"
          required
        >

          <option value="">
            選択してください
          </option>

          <option value="高校1年">
            高校1年
          </option>

          <option value="高校2年">
            高校2年
          </option>

          <option value="高校3年">
            高校3年
          </option>

          <option value="大学1年">
            大学1年
          </option>

          <option value="大学2年">
            大学2年
          </option>

          <option value="大学3年">
            大学3年
          </option>

          <option value="大学4年">
            大学4年
          </option>

          <option value="大学院1年">
            大学院1年
          </option>

          <option value="大学院2年">
            大学院2年
          </option>

          <option value="大学院3年">
            大学院3年
          </option>

          <option value="専門学校1年">
            専門学校1年
          </option>

          <option value="専門学校2年">
            専門学校2年
          </option>

          <option value="専門学校3年">
            専門学校3年
          </option>

          <option value="専門学校4年">
            専門学校4年
          </option>

          <option value="その他">
            その他
          </option>

        </select>

      </div>


      <!-- 学校名 -->

      <div class="field">

        <label class="field-label">
          学校名
          <span class="required">必須</span>
        </label>

        <input
          type="text"
          name="school"
          placeholder="〇〇大学"
          required
        >

      </div>


      <!-- 生年月日 -->

      <div class="field">

        <label class="field-label">
          生年月日
          <span class="required">必須</span>
        </label>

        <input
          type="date"
          name="birthDate"
          required
        >

      </div>


      <!-- メール -->

      <div class="field">

        <label class="field-label">
          メールアドレス
          <span class="required">必須</span>
        </label>

        <input
          type="email"
          name="email"
          placeholder="example@example.com"
          required
        >

      </div>


      <!-- 緊急連絡先 -->

      <div class="field">

        <label class="field-label">
          緊急連絡先
          <span class="required">必須</span>
        </label>

        <input
          type="tel"
          name="emergency"
          placeholder="090-1234-5678"
          required
        >

      </div>


      <!-- =====================================
           希望日程
      ====================================== -->

      <div class="field">

        <label class="field-label">
          希望日程
          <span class="required">必須</span>
        </label>


        <div
          id="dateLoading"
          class="date-loading"
        >
          日程を読み込んでいます…
        </div>


        <div
          id="dateError"
          class="date-error hidden"
        ></div>


        <div
          id="dateList"
          class="date-list hidden"
        ></div>


        <div class="date-note">
          ※ 定員に達した日程は表示されません。<br>
          ※ 先着順での受付となります。
        </div>

      </div>


      <!-- 備考 -->

      <div class="field">

        <label class="field-label">
          備考
        </label>

        <textarea
          name="note"
          placeholder="質問や連絡事項があればご記入ください。"
        ></textarea>

      </div>


      <!-- =====================================
           個人情報
      ====================================== -->

      <div class="privacy">

        <div class="privacy-title">
          個人情報の取り扱いについて
        </div>


        <p>
          収集した個人情報は、法令に基づく場合を除き、
          あらかじめご本人の同意を得ることなく、
          個人データを第三者に提供しません。
        </p>


        <p>
          ご入力いただいた情報は、
          イベント受付、各種連絡、緊急時の連絡、
          その他イベント運営に必要な範囲で使用します。
        </p>


        <label class="privacy-check">

          <input
            type="checkbox"
            name="privacy"
            value="agree"
            required
          >

          <span>
            個人情報の取り扱いについて同意します。
          </span>

        </label>

      </div>


      <!-- =====================================
           送信
      ====================================== -->

      <button
        id="submitButton"
        class="submit-button"
        type="submit"
      >
        応募する
      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>

  </div>

</div>


<!-- =====================================
     送信用iframe
====================================== -->

<iframe
  id="submitFrame"
  name="submitFrame"
  style="display:none;"
></iframe>


<script>

/* =========================================
   設定
========================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyGAKlINKbinXF4dDU58Vux93WOtUsQUQ-_8AMPsw27_u83f4HMrpKrbZY7MgGKo4wgiw/exec';

const LINE_URL =
  'https://lin.ee/84dtwFC';

const DEADLINE =
  new Date(
    '2026-11-24T00:00:00+09:00'
  );


/* =========================================
   要素取得
========================================= */

const form =
  document.getElementById(
    'applicationForm'
  );

const dateLoading =
  document.getElementById(
    'dateLoading'
  );

const dateError =
  document.getElementById(
    'dateError'
  );

const dateList =
  document.getElementById(
    'dateList'
  );

const submitButton =
  document.getElementById(
    'submitButton'
  );

const message =
  document.getElementById(
    'message'
  );


/* =========================================
   日付表示
========================================= */

function formatDateLabel(
  dateString
) {

  const date =
    new Date(
      dateString +
      'T00:00:00+09:00'
    );

  const month =
    date.getMonth() + 1;

  const day =
    date.getDate();

  const weekdays = [
    '日',
    '月',
    '火',
    '水',
    '木',
    '金',
    '土'
  ];

  const weekday =
    weekdays[
      date.getDay()
    ];

  return (
    month +
    '月' +
    day +
    '日（' +
    weekday +
    '）'
  );
}


/* =========================================
   日程API
========================================= */

function loadDates() {

  dateLoading.classList.remove(
    'hidden'
  );

  dateError.classList.add(
    'hidden'
  );

  dateList.classList.add(
    'hidden'
  );

  dateList.innerHTML = '';


  /*
   * 毎回ユニークなJSONP callbackを作る
   */

  const callbackName =
    'xmasDates_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  /*
   * グローバルcallback
   */

  window[callbackName] =
    function(result) {

      console.log(
        '[XMAS] 日程API結果:',
        result
      );


      /*
       * callback削除
       */

      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      /*
       * ローディング終了
       */

      dateLoading.classList.add(
        'hidden'
      );


      /*
       * データ確認
       */

      if (
        !result ||
        !Array.isArray(
          result.dates
        )
      ) {

        showDateError(
          '日程データを取得できませんでした。'
        );

        return;
      }


      /*
       * 締切確認
       */

      if (
        result.closed === true
      ) {

        showDateError(
          '応募受付は終了しました。'
        );

        return;
      }


      /*
       * 日程描画
       */

      renderDates(
        result.dates
      );

    };


  /*
   * scriptタグ方式
   */

  const script =
    document.createElement(
      'script'
    );


  script.async = true;


  script.src =
    API_URL +
    '?action=dates' +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  console.log(
    '[XMAS] 日程API URL:',
    script.src
  );


  /*
   * 読み込みエラー
   */

  script.onerror =
    function() {

      console.error(
        '[XMAS] 日程API読み込みエラー'
      );


      try {

        delete window[
          callbackName
        ];

      } catch (e) {

        window[
          callbackName
        ] = undefined;

      }


      showDateError(
        '日程情報の取得に失敗しました。'
      );

    };


  /*
   * 15秒タイムアウト
   */

  const timeoutId =
    setTimeout(
      function() {

        if (
          window[
            callbackName
          ]
        ) {

          try {

            delete window[
              callbackName
            ];

          } catch (e) {

            window[
              callbackName
            ] = undefined;

          }


          showDateError(
            '日程情報の読み込みに時間がかかっています。ページを再読み込みしてください。'
          );

        }

      },
      15000
    );


  /*
   * callbackが実行されたら
   * timeoutを解除
   */

  const originalCallback =
    window[callbackName];


  window[callbackName] =
    function(result) {

      clearTimeout(
        timeoutId
      );

      originalCallback(
        result
      );

    };


  /*
   * HTMLへ追加
   */

  document
    .head
    .appendChild(
      script
    );
}


/* =========================================
   日程描画
========================================= */

function renderDates(
  dates
) {

  dateList.innerHTML = '';


  /*
   * 残数が1以上だけ表示
   */

  const availableDates =
    dates.filter(
      function(item) {

        return (
          Number(
            item.remaining
          ) > 0
        );

      }
    );


  /*
   * 空きなし
   */

  if (
    availableDates.length === 0
  ) {

    showDateError(
      '現在、選択できる日程がありません。'
    );

    return;
  }


  /*
   * 各日程
   */

  availableDates.forEach(
    function(item, index) {

      const wrapper =
        document.createElement(
          'div'
        );

      wrapper.className =
        'date-item';


      const input =
        document.createElement(
          'input'
        );

      input.type =
        'checkbox';

      input.name =
        'dateChoice';

      input.value =
        item.date;

      input.id =
        'dateChoice_' +
        index;


      const label =
        document.createElement(
          'label'
        );

      label.htmlFor =
        input.id;

      label.textContent =
        formatDateLabel(
          item.date
        );


      wrapper.appendChild(
        input
      );

      wrapper.appendChild(
        label
      );


      dateList.appendChild(
        wrapper
      );

    }
  );


  dateList.classList.remove(
    'hidden'
  );
}


/* =========================================
   日程エラー
========================================= */

function showDateError(
  text
) {

  dateLoading.classList.add(
    'hidden'
  );

  dateList.classList.add(
    'hidden'
  );

  dateError.textContent =
    text;

  dateError.classList.remove(
    'hidden'
  );
}


/* =========================================
   送信
========================================= */

form.addEventListener(
  'submit',
  function(event) {

    event.preventDefault();


    /*
     * 選択日程
     */

    const selectedDates =
      Array.from(
        document.querySelectorAll(
          'input[name="dateChoice"]:checked'
        )
      );


    if (
      selectedDates.length === 0
    ) {

      showMessage(
        '希望日程を1つ以上選択してください。',
        false
      );

      return;
    }


    /*
     * 既存hiddenを削除
     */

    const oldHidden =
      form.querySelector(
        'input[data-xmas-dates="true"]'
      );

    if (oldHidden) {

      oldHidden.remove();

    }


    /*
     * GASへ送る日程
     */

    const hidden =
      document.createElement(
        'input'
      );

    hidden.type =
      'hidden';

    hidden.name =
      'dates';

    hidden.value =
      selectedDates
        .map(
          function(input) {
            return input.value;
          }
        )
        .join(',');

    hidden.dataset.xmasDates =
      'true';


    form.appendChild(
      hidden
    );


    /*
     * 送信状態
     */

    submitButton.disabled =
      true;

    submitButton.textContent =
      '送信中…';

    message.style.display =
      'none';


    /*
     * iframeへPOST
     */

    form.submit();


    /*
     * 30秒でタイムアウト
     */

    window.xmasSubmitTimeout =
      setTimeout(
        function() {

          submitButton.disabled =
            false;

          submitButton.textContent =
            '応募する';


          showMessage(
            '受付結果を確認できませんでした。二重応募を防ぐため、再送信する前に応募者一覧への登録を確認してください。',
            false
          );

        },
        30000
      );

  }
);


/* =========================================
   GASからのPOST結果
========================================= */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data;


    console.log(
      '[XMAS] POST結果:',
      data
    );


    /*
     * 自分のメッセージだけ受け取る
     */

    if (
      !data ||
      data.source !==
      'xmas-market-form'
    ) {

      return;
    }


    /*
     * timeout解除
     */

    if (
      window.xmasSubmitTimeout
    ) {

      clearTimeout(
        window.xmasSubmitTimeout
      );

      window.xmasSubmitTimeout =
        null;
    }


    /*
     * 成功
     */

    if (
      data.success === true
    ) {

      showSuccess();

      return;
    }


    /*
     * 失敗
     */

    submitButton.disabled =
      false;

    submitButton.textContent =
      '応募する';


    showMessage(
      data.message ||
      '応募処理に失敗しました。',
      false
    );

  }
);


/* =========================================
   成功画面
========================================= */

function showSuccess() {

  form.innerHTML = '';


  const success =
    document.createElement(
      'div'
    );

  success.className =
    'message success';

  success.style.display =
    'block';


  success.innerHTML =
    '<strong>応募を受け付けました。</strong>' +
    '<br>' +
    'ご応募ありがとうございます。' +
    '<br><br>' +
    '今後の連絡は公式LINEをご確認ください。' +
    '<br>' +
    '<a ' +
    'class="line-link" ' +
    'href="' +
    LINE_URL +
    '" ' +
    'target="_blank" ' +
    'rel="noopener">' +
    '公式LINEを追加する' +
    '</a>';


  form.appendChild(
    success
  );
}


/* =========================================
   メッセージ
========================================= */

function showMessage(
  text,
  success
) {

  message.textContent =
    text;


  message.className =
    success
      ? 'message success'
      : 'message error';


  message.style.display =
    'block';
}


/* =========================================
   ページ読み込み時
========================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    console.log(
      '[XMAS] フォーム起動'
    );

    loadDates();

  }
);

</script>

</body>
</html>
